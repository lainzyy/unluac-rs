
name: Android Build

on:
  workflow_dispatch:
    inputs:
      android_api:
        description: "Minimum Android API level"
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "31"
          - "32"
          - "33"
          - "34"
          - "35"
          - "36"

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android
            binary: unluac-cli-arm64-v8a

          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi
            binary: unluac-cli-armeabi-v7a

          - abi: x86_64
            target: x86_64-linux-android
            linker: x86_64-linux-android
            binary: unluac-cli-x86_64

          - abi: x86
            target: i686-linux-android
            linker: i686-linux-android
            binary: unluac-cli-x86

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r29
        shell: bash
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android API and linker
        shell: bash
        run: |
          API="${{ inputs.android_api }}"
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_API_LEVEL=${API}" >> "$GITHUB_ENV"

          case "${{ matrix.target }}" in
            aarch64-linux-android)
              LINKER="aarch64-linux-android${API}-clang"
              ;;
            armv7-linux-androideabi)
              LINKER="armv7a-linux-androideabi${API}-clang"
              ;;
            x86_64-linux-android)
              LINKER="x86_64-linux-android${API}-clang"
              ;;
            i686-linux-android)
              LINKER="i686-linux-android${API}-clang"
              ;;
          esac

          test -x "${TOOLCHAIN}/${LINKER}"

          echo "CARGO_TARGET_${{ matrix.target }}_LINKER=${TOOLCHAIN}/${LINKER}" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          echo "NDK: ${ANDROID_NDK_VERSION}"
          echo "Android API: ${ANDROID_API_LEVEL}"

      - name: Build release
        run: |
          cargo build \
            --package unluac-cli \
            --release \
            --locked \
            --target "${{ matrix.target }}"

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release-assets

          cp \
            "target/${{ matrix.target }}/release/unluac-cli" \
            "release-assets/${{ matrix.binary }}"

          chmod +x "release-assets/${{ matrix.binary }}"

          file "release-assets/${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unluac-android-${{ matrix.abi }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  collect-release:
    name: Collect Android Binaries
    runs-on: ubuntu-24.04
    needs: build-android

    permissions:
      contents: write

    steps:
      - name: Download all Android binaries
        uses: actions/download-artifact@v4
        with:
          pattern: unluac-android-*
          merge-multiple: true
          path: release-assets

      - name: Upload build summary
        run: |
          echo "## Android Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "API Level: ${{ inputs.android_api }}" >> "$GITHUB_STEP_SUMMARY"
          echo "NDK: r29" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release-assets >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${GITHUB_REF_NAME}" \
            release-assets/* \
            --clobber
